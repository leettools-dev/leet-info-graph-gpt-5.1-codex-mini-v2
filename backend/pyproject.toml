[project]
name = "infograph-backend"
version = "0.1.0"
description = "Research Infograph Assistant backend service"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "click>=8.0",
    "python-multipart>=0.0.5",
]

[project.optional-dependencies]
tests = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
